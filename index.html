<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="resourse/favicon.icon.png">
  <link rel="apple-touch-icon" href="resourse/favicon.icon.png">
  <title>火星探索·中国号</title>
  <style>
    :root {
      --space-deep: #0b102f;
      --space-purple: #26185f;
      --card-bg: rgba(255, 255, 255, 0.12);
      --card-strong: rgba(255, 255, 255, 0.2);
      --card-border: rgba(255, 255, 255, 0.24);
      --text-main: #ffffff;
      --text-soft: #d8dcff;
      --primary: #5ecbff;
      --secondary: #f6c343;
      --danger: #ff6b6b;
      --success: #69db7c;
      --china-red: #e53935;
      --china-gold: #f6c343;
      --blue: #42a5f5;
      --silver: #cfd8dc;
      --white: #ffffff;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at 16% 18%, rgba(255,255,255,0.18), transparent 22%),
        radial-gradient(circle at 82% 10%, rgba(94,203,255,0.22), transparent 26%),
        radial-gradient(circle at 80% 82%, rgba(246,195,67,0.14), transparent 24%),
        linear-gradient(135deg, #111342 0%, #26185f 48%, #0b102f 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.9) 1px, transparent 1.8px),
        radial-gradient(circle, rgba(255,255,255,0.5) 1px, transparent 1.6px);
      background-size: 92px 92px, 138px 138px;
      background-position: 0 0, 26px 44px;
      opacity: 0.34;
    }

    button, select {
      font: inherit;
    }

    button {
      min-height: 48px;
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      color: #07122f;
      background: linear-gradient(180deg, #ffffff, #d8f4ff);
      box-shadow: 0 8px 0 rgba(0,0,0,0.18);
      cursor: pointer;
      font-weight: 800;
      transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 0 rgba(0,0,0,0.2);
      filter: brightness(1.04);
    }

    button:active:not(:disabled) {
      transform: translateY(4px);
      box-shadow: 0 4px 0 rgba(0,0,0,0.2);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
      transform: none;
      box-shadow: none;
    }

    select {
      min-height: 48px;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 0 14px;
      color: #07122f;
      font-weight: 800;
      background: #ffffff;
    }

    .app-shell {
      position: relative;
      z-index: 1;
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 18px 0 40px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 12px;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      background: rgba(10, 17, 54, 0.78);
      backdrop-filter: blur(12px);
      box-shadow: var(--shadow);
    }

    .stage-nav {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .stage-tab {
      min-height: 58px;
      padding: 10px 12px;
      color: #fff;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: none;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .stage-tab.is-active {
      background: linear-gradient(135deg, rgba(94,203,255,0.35), rgba(246,195,67,0.28));
      border-color: rgba(255,255,255,0.55);
      outline: 3px solid rgba(94,203,255,0.22);
    }

    .stage-tab .title {
      display: block;
      font-size: 18px;
      line-height: 1.1;
      font-weight: 900;
    }

    .stage-tab .sub {
      display: block;
      margin-top: 4px;
      color: var(--text-soft);
      font-size: 14px;
      font-weight: 700;
    }

    .home-btn {
      white-space: nowrap;
      background: linear-gradient(180deg, #ffe89b, #f6c343);
    }

    .page {
      margin-top: 22px;
    }

    .hero {
      min-height: 330px;
      display: grid;
      grid-template-columns: 1.25fr 0.75fr;
      gap: 28px;
      align-items: center;
      padding: 34px;
      border-radius: 14px;
      border: 1px solid var(--card-border);
      background: linear-gradient(135deg, rgba(255,255,255,0.16), rgba(255,255,255,0.07));
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      margin-bottom: 12px;
      font-size: clamp(38px, 5vw, 64px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    h2 {
      margin-bottom: 10px;
      font-size: clamp(30px, 3.8vw, 44px);
      line-height: 1.12;
      letter-spacing: 0;
    }

    h3 {
      margin-bottom: 10px;
      font-size: 26px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    p, li {
      color: var(--text-soft);
      font-size: 21px;
      line-height: 1.55;
      letter-spacing: 0;
    }

    .lead {
      max-width: 780px;
      font-size: 24px;
      color: #fff;
    }

    .space-scene {
      min-height: 230px;
      position: relative;
      display: grid;
      place-items: center;
    }

    .big-planet {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 28% 28%, #ffd5a7, transparent 22%),
        radial-gradient(circle at 72% 62%, #b85036, transparent 26%),
        linear-gradient(135deg, #ef6b4a, #7f2c4b);
      box-shadow: 0 0 60px rgba(255,119,82,0.55);
      animation: planetPulse 3.2s infinite ease-in-out;
    }

    .orbit-ship {
      position: absolute;
      font-size: 66px;
      left: 50%;
      top: 50%;
      animation: orbitGlide 7s ease-in-out infinite;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-top: 22px;
    }

    .card {
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 22px;
      background: var(--card-bg);
      box-shadow: var(--shadow);
    }

    .role-card {
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.16s ease, background 0.16s ease;
    }

    .role-card:hover {
      transform: translateY(-4px);
      background: var(--card-strong);
    }

    .role-icon {
      font-size: 52px;
      margin-bottom: 8px;
    }

    .role-card p {
      font-size: 19px;
      min-height: 88px;
    }

    .view-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: start;
      margin-bottom: 18px;
    }

    .game-layout {
      display: grid;
      grid-template-columns: 1.12fr 0.88fr;
      gap: 18px;
      align-items: start;
    }

    .wide-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .panel {
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 22px;
      background: rgba(255,255,255,0.11);
      box-shadow: var(--shadow);
    }

    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-top: 16px;
    }

    .secondary {
      color: #fff;
      background: rgba(255,255,255,0.16);
      border: 1px solid var(--card-border);
      box-shadow: none;
    }

    .primary {
      background: linear-gradient(180deg, #76e0ff, #5ecbff);
    }

    .gold {
      background: linear-gradient(180deg, #ffe89b, #f6c343);
    }

    .danger {
      color: #fff;
      background: linear-gradient(180deg, #ff8b8b, #ff5d5d);
    }

    .success {
      background: linear-gradient(180deg, #b5f7bf, #69db7c);
    }

    .summary-card {
      margin-top: 18px;
      border-color: rgba(105,219,124,0.65);
      background: linear-gradient(135deg, rgba(105,219,124,0.24), rgba(255,255,255,0.12));
    }

    .summary-card strong {
      display: block;
      margin-bottom: 8px;
      font-size: 24px;
      color: #fff;
    }

    .hidden { display: none !important; }

    .goal-box {
      padding: 16px 18px;
      border-radius: 10px;
      background: rgba(94,203,255,0.16);
      border: 1px solid rgba(94,203,255,0.38);
      color: #fff;
      font-size: 24px;
      font-weight: 900;
      line-height: 1.42;
    }

    .product-scene {
      min-height: 430px;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
    }

    .css-ship {
      position: relative;
      width: 270px;
      height: 180px;
      filter: drop-shadow(0 24px 28px rgba(0,0,0,0.35));
    }

    .css-ship .body {
      position: absolute;
      left: 68px;
      top: 42px;
      width: 155px;
      height: 86px;
      border-radius: 48px 58px 58px 48px;
      background: var(--ship-body, #cfd8dc);
      border: 4px solid rgba(255,255,255,0.72);
    }

    .css-ship .nose {
      position: absolute;
      left: 196px;
      top: 56px;
      width: 72px;
      height: 58px;
      clip-path: polygon(0 0, 100% 50%, 0 100%);
      background: var(--ship-nose, #e53935);
    }

    .css-ship .window {
      position: absolute;
      left: 156px;
      top: 66px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff, #5ecbff 38%, #1872ba);
      border: 4px solid rgba(255,255,255,0.85);
    }

    .css-ship .tail {
      position: absolute;
      left: 32px;
      top: 54px;
      width: 56px;
      height: 64px;
      clip-path: polygon(100% 0, 0 18%, 32% 50%, 0 82%, 100% 100%);
      background: var(--ship-tail, #f6c343);
    }

    .css-ship .stripe {
      position: absolute;
      left: 90px;
      top: 54px;
      width: 22px;
      height: 64px;
      border-radius: 10px;
      background: var(--ship-stripe, #42a5f5);
    }

    .css-ship .arm {
      position: absolute;
      left: 120px;
      top: 118px;
      width: 96px;
      height: 14px;
      border-radius: 10px;
      background: var(--ship-arm, #ffffff);
      transform: rotate(18deg);
      transform-origin: left center;
    }

    .css-ship .arm::after {
      content: "🔬";
      position: absolute;
      right: -22px;
      top: -18px;
      font-size: 28px;
      transform: rotate(-18deg);
    }

    .css-ship .shield {
      position: absolute;
      left: 50px;
      top: 26px;
      width: 200px;
      height: 132px;
      border: 5px solid rgba(94,203,255,0.72);
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
      box-shadow: 0 0 32px rgba(94,203,255,0.55);
    }

    .css-ship.ghost {
      opacity: 0.52;
      filter: grayscale(0.9) drop-shadow(0 24px 28px rgba(0,0,0,0.28));
    }

    .css-ship.decided {
      opacity: 1;
      --ship-body: #ffffff;
      --ship-nose: #e53935;
      --ship-stripe: #f6c343;
      --ship-arm: #cfd8dc;
      --ship-tail: #42a5f5;
      animation: shipPop 0.6s ease both;
    }

    .css-ship.decided .shield { opacity: 1; }

    .product-placeholder {
      padding: 24px 28px;
      border: 2px dashed rgba(255,255,255,0.18);
      border-radius: 14px;
      color: rgba(255,255,255,0.46);
      background: rgba(255,255,255,0.035);
      font-size: 23px;
      font-weight: 700;
      text-align: center;
      line-height: 1.45;
    }

    .product-final-ship {
      width: min(430px, 88%);
      aspect-ratio: 1 / 1;
      object-fit: contain;
      border-radius: 16px;
      background: rgba(255,255,255,0.92);
      box-shadow: 0 24px 46px rgba(0,0,0,0.34);
      animation: shipPop 0.6s ease both;
    }

    .floating-wish-info {
      position: absolute;
      left: 22px;
      top: 22px;
      z-index: 4;
      width: min(340px, calc(100% - 44px));
      min-height: 116px;
      padding: 16px 18px;
      border-radius: 12px;
      border: 1px solid rgba(246,195,67,0.7);
      background: rgba(11,16,47,0.86);
      box-shadow: 0 18px 38px rgba(0,0,0,0.35);
      color: #fff;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.48;
      backdrop-filter: blur(10px);
    }

    .floating-wish-info:empty {
      display: none;
    }

    .wish-list {
      display: grid;
      gap: 12px;
    }

    .wish {
      width: 100%;
      min-height: 92px;
      color: #fff;
      background: rgba(255,255,255,0.16);
      border: 1px solid rgba(255,255,255,0.24);
      box-shadow: none;
      text-align: left;
      animation: float 3.4s infinite ease-in-out;
    }

    .wish:nth-child(2) { animation-delay: -0.8s; }
    .wish:nth-child(3) { animation-delay: -1.6s; }

    .wish.is-selected {
      border-color: var(--secondary);
      background: rgba(246,195,67,0.22);
      outline: 3px solid rgba(246,195,67,0.2);
    }

    .wish .wish-title {
      display: block;
      font-size: 23px;
      font-weight: 900;
    }

    .wish .wish-sub {
      display: block;
      margin-top: 4px;
      color: var(--text-soft);
      font-size: 18px;
    }

    .info-box {
      min-height: 112px;
      padding: 16px;
      border-radius: 10px;
      border: 1px solid rgba(246,195,67,0.45);
      background: rgba(246,195,67,0.14);
      font-size: 21px;
      line-height: 1.5;
    }

    .mission-list {
      margin: 0;
      padding-left: 26px;
    }

    .design-board {
      display: grid;
      grid-template-columns: minmax(360px, 1fr) 340px;
      gap: 18px;
      align-items: start;
    }

    .design-scene {
      min-height: 420px;
      display: grid;
      place-items: center;
    }

    .design-rocket-wrap {
      position: relative;
      width: min(560px, 100%);
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
    }

    .design-rocket {
      position: relative;
      width: 100%;
      height: 100%;
      --body-color: #ffffff;
      --stripe-color: #cfd8dc;
      --tail-color: #cfd8dc;
      --shield-color: #ffffff;
      transition: transform 0.45s ease;
    }

    .design-rocket.showcase {
      animation: showcaseSpin 2.4s ease-in-out;
    }

    .design-ship-image,
    .design-paint-canvas,
    .design-color-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .design-ship-image {
      z-index: 1;
      object-fit: contain;
      border-radius: 16px;
      background: rgba(255,255,255,0.94);
      box-shadow: 0 24px 46px rgba(0,0,0,0.34);
    }

    .design-paint-canvas {
      z-index: 2;
      border-radius: 16px;
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    .design-color-layer {
      z-index: 3;
    }

    .paint-region {
      cursor: pointer;
      pointer-events: all;
      fill-opacity: 0;
      stroke: transparent;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: fill-opacity 0.16s ease, stroke 0.16s ease;
    }

    .paint-region.is-painted {
      fill-opacity: 0;
    }

    .paint-region:hover,
    .paint-region.is-selected {
      stroke: transparent;
    }

    .paint-region.is-painted:hover,
    .paint-region.is-painted.is-selected {
      fill-opacity: 0;
    }

    .rocket-part {
      cursor: pointer;
      transition: filter 0.16s ease, outline 0.16s ease, transform 0.16s ease;
    }

    .rocket-part:hover,
    .rocket-part.is-selected {
      filter: brightness(1.18);
      outline: 4px solid rgba(246,195,67,0.75);
      outline-offset: 4px;
      transform: scale(1.02);
    }

    .design-rocket .body {
      position: absolute;
      left: 86px;
      top: 58px;
      width: 190px;
      height: 100px;
      border-radius: 56px;
      background: var(--body-color);
      border: 5px solid #fff;
    }

    .design-rocket .nose {
      position: absolute;
      left: 250px;
      top: 72px;
      width: 86px;
      height: 72px;
      clip-path: polygon(0 0, 100% 50%, 0 100%);
      background: #e53935;
      border-radius: 6px;
    }

    .design-rocket .tail {
      position: absolute;
      left: 44px;
      top: 74px;
      width: 70px;
      height: 70px;
      clip-path: polygon(100% 0, 0 18%, 34% 50%, 0 82%, 100% 100%);
      background: var(--tail-color);
    }

    .design-rocket .stripe {
      position: absolute;
      left: 112px;
      top: 72px;
      width: 26px;
      height: 74px;
      border-radius: 12px;
      background: var(--stripe-color);
    }

    .design-rocket .window {
      position: absolute;
      left: 204px;
      top: 82px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fff, #5ecbff 38%, #1872ba);
      border: 5px solid rgba(255,255,255,0.9);
      pointer-events: none;
    }

    .design-rocket .arm {
      position: absolute;
      left: 148px;
      top: 150px;
      width: 118px;
      height: 16px;
      border-radius: 12px;
      background: var(--arm-color);
      transform: rotate(20deg);
      transform-origin: left center;
    }

    .design-rocket .arm::after {
      content: "🔬";
      position: absolute;
      right: -24px;
      top: -18px;
      font-size: 30px;
      transform: rotate(-20deg);
    }

    .flag-marker {
      position: absolute;
      display: none;
      font-size: 34px;
      filter: drop-shadow(0 3px 4px rgba(0,0,0,0.45));
      z-index: 5;
    }

    .flag-marker.bodyLeft { display: block; left: 126px; top: 84px; }
    .flag-marker.bodyRight { display: block; left: 202px; top: 84px; }
    .flag-marker.tail { display: block; left: 56px; top: 84px; }
    .flag-marker.shield { display: block; left: 98px; top: 36px; }
    .flag-marker.center {
      display: block;
      left: 55%;
      top: 41%;
      transform: translate(-50%, -50%);
      font-size: 44px;
      z-index: 4;
    }

    .flag-hotspot {
      position: absolute;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 3px dashed rgba(246,195,67,0.9);
      background: rgba(246,195,67,0.16);
      color: #fff;
      display: none;
      place-items: center;
      box-shadow: none;
      padding: 0;
    }

    .flag-mode .flag-hotspot { display: grid; }
    .flag-hotspot.bodyLeft { left: 122px; top: 78px; }
    .flag-hotspot.bodyRight { left: 198px; top: 78px; }
    .flag-hotspot.tail { left: 52px; top: 78px; }
    .flag-hotspot.shield { left: 94px; top: 30px; }

    .palette {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .color-btn {
      min-height: 64px;
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
    }

    .custom-color-btn {
      position: relative;
      color: #07122f;
      background: linear-gradient(180deg, #ffffff, #e7f6ff);
      box-shadow: 0 8px 0 rgba(0,0,0,0.18);
      border-radius: 8px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: 800;
      overflow: hidden;
    }

    .custom-color-input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .swatch {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid rgba(0,0,0,0.18);
    }

    .part-list,
    .flag-position-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .mini-btn {
      min-height: 44px;
      padding: 10px 12px;
      font-size: 17px;
    }

    .mini-btn.is-selected {
      outline: 3px solid rgba(246,195,67,0.45);
      background: linear-gradient(180deg, #ffe89b, #f6c343);
    }

    .dev-layout {
      display: grid;
      grid-template-columns: minmax(380px, 1fr) 410px;
      gap: 18px;
      align-items: stretch;
    }

    .dev-map-panel,
    .dev-code-panel {
      min-height: 662px;
    }

    .dev-code-panel {
      display: flex;
      flex-direction: column;
    }

    .settings-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 16px;
    }

    .settings-row label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 19px;
      color: #fff;
      font-weight: 900;
    }

    .maze {
      width: min(100%, 560px);
      aspect-ratio: 1 / 1;
      display: grid;
      gap: 6px;
      margin: 0 auto;
      padding: 8px;
      border-radius: 12px;
      background: rgba(0,0,0,0.22);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .cell {
      position: relative;
      min-width: 0;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.13);
      font-size: clamp(28px, 5vw, 54px);
      overflow: hidden;
    }

    .cell.start::after,
    .cell.goal::after {
      position: absolute;
      left: 6px;
      bottom: 4px;
      font-size: 12px;
      font-weight: 900;
      color: rgba(255,255,255,0.9);
    }

    .cell.start::after { content: "地球"; }
    .cell.goal {
      background: radial-gradient(circle, rgba(255,92,92,0.36), rgba(255,255,255,0.12));
      outline: 2px solid rgba(255,107,107,0.55);
    }
    .cell.goal::after { content: "火星"; }

    .ship-emoji {
      display: inline-block;
      transform: rotate(var(--ship-rotate, -45deg));
      transition: transform 0.22s ease;
      filter: drop-shadow(0 5px 7px rgba(0,0,0,0.5));
    }

    .ship-emoji.shake {
      animation: shake 0.42s ease-in-out;
    }

    .cell.celebrate {
      animation: cellCelebrate 0.75s ease-in-out infinite alternate;
    }

    .code-box {
      height: 420px;
      flex: none;
      overflow: auto;
      padding: 12px;
      border-radius: 10px;
      background: #07122f;
      border: 1px solid rgba(94,203,255,0.34);
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    }

    .code-line {
      min-height: 36px;
      padding: 7px 10px;
      border-radius: 7px;
      color: #dff6ff;
      font-size: 21px;
      line-height: 1.2;
    }

    .code-line.is-active {
      background: rgba(246,195,67,0.24);
      color: #fff3b0;
      outline: 2px solid rgba(246,195,67,0.6);
    }

    .status-message {
      min-height: 56px;
      display: flex;
      align-items: center;
      padding: 12px 14px;
      border-radius: 10px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      color: #fff;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.35;
    }

    .dev-notice-backdrop {
      position: fixed;
      inset: 0;
      z-index: 24;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(4, 8, 26, 0.42);
    }

    .dev-notice {
      width: min(620px, 100%);
      border-radius: 14px;
      padding: 26px;
      border: 2px solid rgba(255,255,255,0.35);
      background: rgba(15, 23, 66, 0.94);
      box-shadow: 0 26px 70px rgba(0,0,0,0.46);
      text-align: center;
      backdrop-filter: blur(12px);
      animation: shipPop 0.28s ease both;
    }

    .dev-notice.success {
      border-color: rgba(105,219,124,0.8);
      background: linear-gradient(135deg, rgba(28,86,54,0.96), rgba(15,23,66,0.94));
    }

    .dev-notice.error {
      border-color: rgba(255,107,107,0.82);
      background: linear-gradient(135deg, rgba(105,32,42,0.96), rgba(15,23,66,0.94));
    }

    .dev-notice h3 {
      margin-bottom: 12px;
      font-size: 34px;
    }

    .dev-notice p {
      color: #fff;
      font-size: 26px;
      font-weight: 900;
    }

    .maintain-scene {
      min-height: 430px;
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      background:
        radial-gradient(circle at 76% 28%, rgba(94,203,255,0.22), transparent 18%),
        linear-gradient(135deg, rgba(0,0,0,0.24), rgba(255,255,255,0.08));
    }

    .earth {
      position: absolute;
      right: 58px;
      top: 48px;
      width: 132px;
      height: 132px;
      border-radius: 50%;
      background-image: url("resourse/earth.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      box-shadow: 0 0 38px rgba(94,203,255,0.72);
      overflow: hidden;
    }

    .return-ship {
      position: absolute;
      left: 18%;
      top: 48%;
      font-size: 86px;
      transform: rotate(45deg);
      transition: left 1.2s ease, filter 0.2s ease, box-shadow 0.2s ease;
      filter: drop-shadow(0 16px 18px rgba(0,0,0,0.48));
    }

    .return-ship.success-flight {
      left: 72%;
      animation: shipPop 0.7s ease both;
    }

    .crisis-effect {
      position: absolute;
      left: 13%;
      top: 39%;
      width: 190px;
      min-height: 82px;
      display: grid;
      place-items: center;
      font-size: 44px;
      pointer-events: none;
    }

    .crisis-panel {
      position: absolute;
      left: 22px;
      top: 22px;
      z-index: 4;
      max-width: calc(100% - 44px);
      padding: 16px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.32);
      background: rgba(11,16,47,0.86);
      box-shadow: 0 18px 38px rgba(0,0,0,0.35);
      backdrop-filter: blur(10px);
    }

    .crisis-panel h3 {
      margin-bottom: 8px;
      font-size: 24px;
      white-space: nowrap;
    }

    .crisis-panel p {
      margin-bottom: 12px;
      color: #fff;
      font-size: 22px;
      font-weight: 900;
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .maintain-topline {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .maintain-count {
      min-height: 48px;
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border-radius: 8px;
      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.22);
      color: #fff;
      font-size: 20px;
      font-weight: 900;
    }

    .maintain-control-row {
      display: grid;
      grid-template-columns: 0.8fr 1.2fr;
      gap: 18px;
      align-items: end;
      margin-bottom: 18px;
    }

    .maintain-status-box h3,
    .maintain-actions-box h3 {
      margin-bottom: 10px;
    }

    .maintain-actions {
      grid-template-columns: repeat(4, 1fr);
    }

    .ship-cold {
      filter: hue-rotate(160deg) brightness(1.25) drop-shadow(0 0 24px rgba(120,220,255,0.85));
    }

    .ship-hot {
      filter: hue-rotate(-30deg) saturate(1.8) drop-shadow(0 0 28px rgba(255,90,60,0.9));
    }

    .ship-dark {
      filter: brightness(0.45) drop-shadow(0 0 18px rgba(255,255,255,0.4));
      animation: blink 0.6s infinite alternate;
    }

    .ship-damaged {
      filter: drop-shadow(0 0 26px rgba(255,80,40,0.95));
      animation: shake 0.55s infinite ease-in-out;
    }

    .meter {
      height: 28px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.24);
    }

    .meter-fill {
      height: 100%;
      width: var(--meter, 100%);
      background: linear-gradient(90deg, var(--danger), var(--secondary), var(--success));
      transition: width 0.25s ease;
    }

    .countdown-fill {
      height: 100%;
      width: var(--time, 100%);
      background: linear-gradient(90deg, #69db7c, #f6c343, #ff6b6b);
      transition: width 0.1s linear;
    }

    .actions-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .final-table {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border-radius: 10px;
      font-size: 21px;
    }

    .final-table th,
    .final-table td {
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.18);
      text-align: left;
      vertical-align: top;
    }

    .final-table th {
      background: rgba(94,203,255,0.2);
      color: #fff;
      font-size: 23px;
    }

    .final-table td {
      color: var(--text-soft);
      background: rgba(255,255,255,0.08);
    }

    .quote {
      margin: 24px 0 0;
      padding: 22px;
      border-radius: 12px;
      background: rgba(246,195,67,0.18);
      border: 1px solid rgba(246,195,67,0.45);
      color: #fff;
      font-size: 30px;
      line-height: 1.42;
      font-weight: 900;
      text-align: center;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(4, 8, 26, 0.72);
    }

    .modal {
      width: min(720px, 100%);
      border-radius: 14px;
      border: 1px solid var(--card-border);
      padding: 24px;
      background: #151b4a;
      box-shadow: var(--shadow);
    }

    .modal p {
      color: #fff;
      white-space: pre-line;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }

    @keyframes orbitGlide {
      0%, 100% { transform: translate(-118px, -118px) rotate(17deg) scale(0.9); z-index: 1; }
      25% { transform: translate(118px, -42px) rotate(17deg) scale(0.96); z-index: 2; }
      50% { transform: translate(16px, 108px) rotate(17deg) scale(1.04); z-index: 3; }
      75% { transform: translate(-142px, -12px) rotate(17deg) scale(0.88); z-index: 1; }
    }

    @keyframes planetPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    @keyframes shipPop {
      0% { transform: scale(0.9); }
      55% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @keyframes showcaseSpin {
      0% { transform: rotate(0deg) scale(1); }
      55% { transform: rotate(360deg) scale(1.08); }
      100% { transform: rotate(360deg) scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0) rotate(var(--ship-rotate, -45deg)); }
      25% { transform: translateX(-7px) rotate(var(--ship-rotate, -45deg)); }
      50% { transform: translateX(7px) rotate(var(--ship-rotate, -45deg)); }
      75% { transform: translateX(-4px) rotate(var(--ship-rotate, -45deg)); }
    }

    @keyframes blink {
      from { opacity: 0.55; }
      to { opacity: 1; }
    }

    @keyframes cellCelebrate {
      from { box-shadow: inset 0 0 0 rgba(246,195,67,0); }
      to { box-shadow: inset 0 0 34px rgba(246,195,67,0.7); }
    }

    @media (max-width: 980px) {
      .topbar, .hero, .game-layout, .design-board, .dev-layout, .maintain-control-row {
        grid-template-columns: 1fr;
      }
      .maintain-actions {
        grid-template-columns: repeat(2, 1fr);
      }
      .stage-nav, .cards-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .home-btn {
        width: 100%;
      }
      .design-rocket-wrap {
        width: 100%;
        transform: scale(0.9);
      }
    }

    @media (max-width: 640px) {
      .app-shell {
        width: min(100% - 18px, 1180px);
      }
      .stage-nav, .cards-grid, .actions-grid, .maintain-actions, .palette, .part-list, .flag-position-list {
        grid-template-columns: 1fr;
      }
      .stage-tab .title {
        font-size: 16px;
      }
      .hero, .panel, .card {
        padding: 16px;
      }
      p, li {
        font-size: 18px;
      }
      .lead {
        font-size: 20px;
      }
    }
  </style>
</head>
<body>
  <div id="app" class="app-shell"></div>

  <script>
    const STAGES = [
      { id: "product", icon: "🚀", role: "产品岗", nickname: "任务队长", shortAction: "想清楚", description: "听大家的愿望，想清楚这次任务最重要的目标。" },

      down: { x: 0, y: 1, rotation: 135 },

    const MAZE_OBSTACLE_COUNTS = {
      5: { easy: 3, normal: 5, challenge: 7 },

      7: { easy: 7, normal: 11, challenge: 15 }
    };

    const CRISIS_LIST = [
      { id: "cold", name: "低温结冰", message: "飞船进入低温区，外壳开始结冰！", effectClass: "ship-cold", correctAction: "heat", correctText: "🔥 加温", emoji: "❄️❄️" },

    const SUMMARY_CARDS = {

    const HOST_TIPS = {
      product: "同学们，造飞船之前，我们不能马上开工。\n第一件事是想清楚：这次任务最重要的目标是什么？\n有人想要更安全，有人想要更多科学仪器，也有人想要飞得更快。\n但是火箭的能力有限，不能什么都要。\n产品岗就像任务队长，要听大家的想法，然后根据目标做选择。",
      design: "现在任务已经定好了，但飞船还只是一个想法。\n设计岗要把它变成看得见的样子。\n设计不是随便涂漂亮，而是要让飞船好看、好认、好使用。\n比如我们把中国国旗放在醒目的位置，别人一看就知道：这是中国号！",

    };

    const appState = {
      view: "home",
      modalStage: null,
      completed: { product: false, design: false, develop: false, maintain: false },
      product: { selectedWish: null, decided: false },
      design: {
        selectedPart: "body",
        colors: { body: "", shieldStripe: "", window: "", tail: "", shield: "" },
        flagMode: false,
        flagPosition: "",
        completed: false
      },
      develop: {
        size: 5,
        difficulty: "easy",
        obstacles: [],
        commands: [],
        position: { x: 0, y: 4 },
        direction: "up",
        running: false,
        activeLine: -1,
        message: "用按钮生成代码，让飞船从左下角飞到右上角。",
        notice: null,
        success: false,

      },
      maintain: {

        speed: "fast",
        status: 100,
        solved: 0,
        active: false,
        crisis: null,
        lastCrisisId: "",
        message: "设置任务后，点击开始返航任务。",
        success: false,
        returning: false,
        timedOut: false,
        crisisStartedAt: 0,
        countdownTimer: null,
        nextTimer: null
      }
    };

    const app = document.getElementById("app");

    function allCompleted() {
      return STAGES.every((stage) => appState.completed[stage.id]);
    }

    function stageIndex(id) {
      return STAGES.findIndex((stage) => stage.id === id);
    }

    function currentStageId() {
      return STAGES.some((stage) => stage.id === appState.view) ? appState.view : "";
    }

    function showView(view) {
      if (appState.view === "maintain" && view !== "maintain" && appState.maintain.active && !appState.maintain.success) {
        clearMaintainTimers();
        appState.maintain.active = false;
        appState.maintain.crisis = null;
        appState.maintain.message = "返航任务已暂停，回到本关后可重新开始。";
      } else {
        clearMaintainTimers();
      }
      appState.modalStage = null;

    function mazeHtml() {
      const size = appState.develop.size;
      const ship = appState.develop.position;
      const goal = { x: size - 1, y: 0 };
      const start = { x: 0, y: size - 1 };
      const obstacleSet = new Set(appState.develop.obstacles.map((item) => `${item.x},${item.y}`));
      const cells = [];
      for (let y = 0; y < size; y += 1) {
        for (let x = 0; x < size; x += 1) {
          const key = `${x},${y}`;
          const hasShip = ship.x === x && ship.y === y;
          const isGoal = goal.x === x && goal.y === y;
          const isStart = start.x === x && start.y === y;
          const isObstacle = obstacleSet.has(key);
          const rotation = DIRECTION_DELTA[appState.develop.direction].rotation;
          cells.push(`
            <div class="cell ${isStart ? "start" : ""} ${isGoal ? "goal" : ""} ${appState.develop.success && isGoal ? "celebrate" : ""}" data-cell="${key}">
              ${isObstacle ? "🌑" : ""}
              ${isGoal ? "🔴" : ""}
              ${hasShip ? `<span class="ship-emoji" id="mazeShip" style="--ship-rotate:${rotation}deg">🚀</span>` : ""}
            </div>
          `);
        }
      }
      return `<div class="maze" id="maze" style="grid-template-columns:repeat(${size}, 1fr);">${cells.join("")}</div>`;
    }

    function ensureDesignMasks(onReady) {
      const entries = Object.entries(DESIGN_REGION_MASKS);
      const ready = entries.every(([part]) => designMaskImages[part]);
      if (ready) {
        onReady();
        return;
      }
      if (designMasksLoading) return;
      designMasksLoading = true;
      let remaining = entries.length;
      entries.forEach(([part, src]) => {
        const image = new Image();
        image.onload = () => {
          designMaskImages[part] = image;
          remaining -= 1;
          if (remaining === 0) {
            designMasksLoading = false;
            drawDesignPaintCanvas();
          }
        };
        image.src = src;
      });
    }

    function drawDesignPaintCanvas() {
      const canvas = document.querySelector(".design-paint-canvas");
      if (!canvas) return;
      ensureDesignMasks(() => {
        const ctx = canvas.getContext("2d");
        const tintCanvas = document.createElement("canvas");
        tintCanvas.width = canvas.width;
        tintCanvas.height = canvas.height;
        const tintCtx = tintCanvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        Object.entries(appState.design.colors).forEach(([part, color]) => {
          if (!color || !designMaskImages[part]) return;
          tintCtx.clearRect(0, 0, tintCanvas.width, tintCanvas.height);
          tintCtx.globalCompositeOperation = "source-over";
          tintCtx.globalAlpha = 1;
          tintCtx.drawImage(designMaskImages[part], 0, 0, tintCanvas.width, tintCanvas.height);
          tintCtx.globalCompositeOperation = "source-in";
          tintCtx.fillStyle = color;
          tintCtx.globalAlpha = 0.58;
          tintCtx.fillRect(0, 0, tintCanvas.width, tintCanvas.height);
          ctx.drawImage(tintCanvas, 0, 0);
        });
      });
    }

    function afterRender() {
      drawDesignPaintCanvas();
      const codeBox = document.getElementById("codeBox");
      if (!codeBox) return;
      const activeLine = codeBox.querySelector(".code-line.is-active");
      if (activeLine && appState.develop.running) {
        activeLine.scrollIntoView({ block: "center" });
        return;
      }
      codeBox.scrollTop = codeBox.scrollHeight;
    }

    function updateProductWishUI() {
      const selected = PRODUCT_WISHES.find((wish) => wish.id === appState.product.selectedWish);
      document.querySelectorAll(".wish").forEach((button) => {
        button.classList.toggle("is-selected", button.dataset.wish === appState.product.selectedWish);
      });
      const floatInfo = document.getElementById("productWishFloat");
      if (floatInfo && selected && !appState.product.decided) {
        floatInfo.innerHTML = `好处：${selected.benefit}<br>代价：${selected.tradeoff}`;
      }
    }

    function resetProduct() {
      appState.product = { selectedWish: null, decided: false };
    }

    function resetDesign() {
      appState.design = {
        selectedPart: "body",
        colors: { body: "", shieldStripe: "", window: "", tail: "", shield: "" },
        flagMode: false,
        flagPosition: "",
        completed: false
      };
    }

    function shuffleCells(cells) {
      const copy = cells.slice();
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function hasReachablePath(size, obstacles) {
      const start = { x: 0, y: size - 1 };
      const goal = { x: size - 1, y: 0 };
      const blocked = new Set(obstacles.map((item) => `${item.x},${item.y}`));
      const queue = [start];
      const visited = new Set([`${start.x},${start.y}`]);
      const steps = [
        { x: 0, y: -1 },
        { x: 1, y: 0 },
        { x: 0, y: 1 },
        { x: -1, y: 0 }
      ];

      while (queue.length) {
        const current = queue.shift();
        if (current.x === goal.x && current.y === goal.y) return true;
        for (const step of steps) {
          const next = { x: current.x + step.x, y: current.y + step.y };
          const key = `${next.x},${next.y}`;
          if (next.x < 0 || next.y < 0 || next.x >= size || next.y >= size) continue;
          if (blocked.has(key) || visited.has(key)) continue;
          visited.add(key);
          queue.push(next);
        }
      }
      return false;
    }

    function generateRandomObstacles(size, difficulty) {
      const count = MAZE_OBSTACLE_COUNTS[size][difficulty];
      const protectedCells = new Set([
        `0,${size - 1}`,
        `${size - 1},0`,
        `0,${size - 2}`
      ]);
      const candidates = [];
      for (let y = 0; y < size; y += 1) {
        for (let x = 0; x < size; x += 1) {
          if (!protectedCells.has(`${x},${y}`)) candidates.push({ x, y });
        }
      }

      for (let attempt = 0; attempt < 200; attempt += 1) {
        const obstacles = shuffleCells(candidates).slice(0, count);
        if (hasReachablePath(size, obstacles)) return obstacles;
      }

      return [];
    }

    function resetMaze() {
      const size = appState.develop.size;
      appState.develop.obstacles = generateRandomObstacles(size, appState.develop.difficulty);
      appState.develop.commands = [];
      appState.develop.position = { x: 0, y: size - 1 };
      appState.develop.direction = "up";
      appState.develop.running = false;
      appState.develop.activeLine = -1;
      appState.develop.message = "用按钮生成代码，让飞船从左下角飞到右上角。";
      appState.develop.notice = null;
      appState.develop.success = false;
      appState.develop.runId += 1;
    }

    function resetMaintain(keepSettings = true) {
      const target = keepSettings ? appState.maintain.target : 3;
      const speed = keepSettings ? appState.maintain.speed : "fast";
      clearMaintainTimers();
      appState.maintain = {
        target,
        speed,
        status: 100,
        solved: 0,
        active: false,
        crisis: null,
        lastCrisisId: "",
        message: "设置任务后，点击开始返航任务。",
        success: false,
        returning: false,
        timedOut: false,
        crisisStartedAt: 0,
        countdownTimer: null,
        nextTimer: null
      };
    }

    function clearMaintainTimers() {
      if (appState.maintain.countdownTimer) clearInterval(appState.maintain.countdownTimer);
      if (appState.maintain.nextTimer) clearTimeout(appState.maintain.nextTimer);
      appState.maintain.countdownTimer = null;
      appState.maintain.nextTimer = null;
    }

    function startMaintain() {
      resetMaintain(true);
      appState.maintain.active = true;
      appState.maintain.message = "返航开始，准备处理危机！";
      render();
      triggerCrisis();
    }

    function triggerCrisis() {
      clearMaintainTimers();
      if (appState.view !== "maintain" || !appState.maintain.active || appState.maintain.success) return;
      const choices = CRISIS_LIST.filter((crisis) => crisis.id !== appState.maintain.lastCrisisId);
      const crisis = choices[Math.floor(Math.random() * choices.length)];
      appState.maintain.crisis = crisis;
      appState.maintain.lastCrisisId = crisis.id;
      appState.maintain.message = crisis.message;
      appState.maintain.timedOut = false;
      appState.maintain.crisisStartedAt = Date.now();
      render();
      appState.maintain.countdownTimer = setInterval(updateCountdown, 100);
    }

    function updateCountdown() {
      if (!appState.maintain.crisis) return;
      const elapsed = Date.now() - appState.maintain.crisisStartedAt;
      const remaining = Math.max(0, 5000 - elapsed);
      const percent = Math.ceil((remaining / 5000) * 100);
      const bar = document.getElementById("countdownFill");
      if (bar) bar.style.setProperty("--time", `${percent}%`);
      if (remaining <= 0 && !appState.maintain.timedOut) {
        appState.maintain.timedOut = true;
        appState.maintain.status = Math.max(10, appState.maintain.status - 18);
        appState.maintain.message = "时间到了，飞船状态下降！但还可以继续选择正确方案。";
        if (appState.maintain.status <= 20) {
          appState.maintain.message = "飞船情况很危险，但救援员不会放弃！请继续选择正确方案。";
        }
        render();
      }
    }

    function handleMaintainAction(actionId) {
      const crisis = appState.maintain.crisis;
      if (!crisis) return;
      if (actionId !== crisis.correctAction) {
        appState.maintain.status = Math.max(10, appState.maintain.status - 12);
        appState.maintain.message = appState.maintain.status <= 20 ? "飞船情况很危险，但救援员不会放弃！不对哦，再想想！" : "不对哦，再想想！";
        render();
        return;
      }
      clearMaintainTimers();
      appState.maintain.solved += 1;
      appState.maintain.status = Math.min(100, appState.maintain.status + 16);
      appState.maintain.crisis = null;
      appState.maintain.timedOut = false;
      if (appState.maintain.solved >= appState.maintain.target) {
        appState.maintain.active = false;
        appState.maintain.returning = true;
        appState.maintain.message = "所有危机已解除，飞船正在靠近地球。";
        render();
        appState.maintain.nextTimer = setTimeout(() => {
          appState.maintain.returning = false;
          appState.maintain.success = true;
          appState.maintain.message = "守护成功！火星样本安全抵达地球！";
          completeStage("maintain");
          render();
        }, 1300);
        return;
      }
      appState.maintain.message = "危机解除！下一次危机即将出现。";
      render();
      appState.maintain.nextTimer = setTimeout(triggerCrisis, MAINTAIN_SPEEDS[appState.maintain.speed].delay);
    }

    function addCommand(command) {
      if (appState.develop.running) return;
      appState.develop.notice = null;
      appState.develop.commands.push(command);
      appState.develop.activeLine = appState.develop.commands.length - 1;
      appState.develop.success = false;

      if (command === "turnLeft" || command === "turnRight") {
        appState.develop.direction = turn(appState.develop.direction, command);
        appState.develop.message = command === "turnLeft" ? "已添加：turnLeft()，飞船向左转。" : "已添加：turnRight()，飞船向右转。";
        render();
        return;
      }

      const delta = DIRECTION_DELTA[appState.develop.direction];
      const next = { x: appState.develop.position.x + delta.x, y: appState.develop.position.y + delta.y };
      const out = next.x < 0 || next.y < 0 || next.x >= appState.develop.size || next.y >= appState.develop.size;
      if (out || isObstacle(next)) {
        appState.develop.message = "这一步会碰到石头或飞出地图，代码已清空，请重新规划路线。";
        appState.develop.notice = {
          type: "error",
          title: "🚧 代码提醒",
          text: "这一步会碰到石头或飞出地图，代码已清空，请重新规划路线。"
        };
        render();
        const ship = document.getElementById("mazeShip");
        if (ship) ship.classList.add("shake");
        setTimeout(() => {
          appState.develop.position = { x: 0, y: appState.develop.size - 1 };
          appState.develop.direction = "up";
          appState.develop.commands = [];
          appState.develop.activeLine = -1;
          appState.develop.success = false;
          render();
        }, 450);
        return;
      }

      appState.develop.position = next;
      appState.develop.message = "已添加：forward()，飞船前进一步。";
      if (next.x === appState.develop.size - 1 && next.y === 0) {
        appState.develop.success = true;
        appState.develop.message = "飞船预演到达火星！点击执行代码检查一遍。";
        appState.develop.notice = {
          type: "success",
          title: "🎉 预演成功",
          text: "飞船预演到达火星！点击执行代码检查一遍。"
        };
      }
      render();
    }

    function turn(direction, turnType) {
      const index = DIRECTION_ORDER.indexOf(direction);
      if (turnType === "turnLeft") return DIRECTION_ORDER[(index + 3) % 4];
      return DIRECTION_ORDER[(index + 1) % 4];
    }

    function isObstacle(pos) {
      return appState.develop.obstacles.some((item) => item.x === pos.x && item.y === pos.y);
    }

    function sleep(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function runCode() {
      if (appState.develop.running || !appState.develop.commands.length) return;
      appState.develop.running = true;
      appState.develop.success = false;
      appState.develop.position = { x: 0, y: appState.develop.size - 1 };
      appState.develop.direction = "up";
      appState.develop.message = "代码开始执行，请观察飞船动作。";
      appState.develop.notice = null;
      const runId = appState.develop.runId + 1;
      appState.develop.runId = runId;
      render();

      for (let i = 0; i < appState.develop.commands.length; i += 1) {
        if (appState.develop.runId !== runId || appState.view !== "develop") return;
        appState.develop.activeLine = i;
        render();
        await sleep(500);
        const command = appState.develop.commands[i];
        if (command === "turnLeft" || command === "turnRight") {
          appState.develop.direction = turn(appState.develop.direction, command);
          render();
          await sleep(120);
          continue;
        }
        const delta = DIRECTION_DELTA[appState.develop.direction];
        const next = { x: appState.develop.position.x + delta.x, y: appState.develop.position.y + delta.y };
        const out = next.x < 0 || next.y < 0 || next.x >= appState.develop.size || next.y >= appState.develop.size;
        if (out || isObstacle(next)) {
          failDevelop();
          return;
        }
        appState.develop.position = next;
        render();
        if (next.x === appState.develop.size - 1 && next.y === 0) {
          appState.develop.success = true;
          appState.develop.running = false;
          appState.develop.activeLine = -1;
          appState.develop.message = "到达火星！代码成功！";
          completeStage("develop");
          render();
          return;
        }
        await sleep(120);
      }
      appState.develop.running = false;
      appState.develop.activeLine = -1;
      appState.develop.message = "代码执行完了，还没到火星。再加几行试试。";
      render();
    }

    function failDevelop() {
      appState.develop.running = false;
      appState.develop.activeLine = -1;
      appState.develop.message = "碰到石头了！代码已清空，请重新规划路线。";
      appState.develop.notice = {
        type: "error",
        title: "🚧 碰到石头了",
        text: "碰到石头了！代码已清空，请重新规划路线。"
      };
      render();
      const ship = document.getElementById("mazeShip");
      if (ship) ship.classList.add("shake");
      setTimeout(() => {
        appState.develop.position = { x: 0, y: appState.develop.size - 1 };
        appState.develop.direction = "up";
        appState.develop.commands = [];
        appState.develop.activeLine = -1;
        appState.develop.success = false;
        render();
      }, 450);
    }

    function playAgain() {
      appState.completed = { product: false, design: false, develop: false, maintain: false };
      resetProduct();
      resetDesign();
      appState.develop.size = 5;
      appState.develop.difficulty = "easy";
      resetMaze();
      resetMaintain(false);
      showView("home");
    }

    document.addEventListener("click", (event) => {
      const target = event.target.closest("[data-action]");
      if (!target) return;
      const action = target.dataset.action;
      if (action === "close-modal") {
        if ((target.classList.contains("modal-backdrop") && event.target === target) || target.tagName === "BUTTON") {
          appState.modalStage = null;
          render();
        }
        return;
      }
      if (action === "close-dev-notice") {
        if ((target.classList.contains("dev-notice-backdrop") && event.target === target) || target.tagName === "BUTTON") {
          appState.develop.notice = null;
          render();
        }
        return;
      }
      event.stopPropagation();
      if (action === "go") showView(target.dataset.view);
      if (action === "tip") {
        appState.modalStage = target.dataset.stage;
        render();
      }
      if (action === "select-wish") {
        if (appState.product.decided) return;
        appState.product.selectedWish = target.dataset.wish;
        updateProductWishUI();
      }
      if (action === "product-decide") {
        appState.product.decided = true;
        appState.product.selectedWish = null;
        completeStage("product");
        render();
      }
      if (action === "select-part") {
        appState.design.selectedPart = target.dataset.part;
        render();
      }
      if (action === "paint") {
        appState.design.colors[appState.design.selectedPart] = target.dataset.color;
        render();
      }
      if (action === "flag-mode") {
        appState.design.flagPosition = "center";
        render();
      }
      if (action === "place-flag") {
        appState.design.flagMode = true;
        appState.design.flagPosition = target.dataset.position;
        render();
      }
      if (action === "finish-design") {
        appState.design.completed = true;
        completeStage("design");
        render();
      }
      if (action === "add-command") addCommand(target.dataset.command);
      if (action === "clear-code") {
        appState.develop.commands = [];
        appState.develop.activeLine = -1;
        appState.develop.success = false;
        appState.develop.position = { x: 0, y: appState.develop.size - 1 };
        appState.develop.direction = "up";
        appState.develop.notice = null;
        appState.develop.message = "代码已清空，可以重新安排路线。";
        render();
      }
      if (action === "run-code") runCode();
      if (action === "reset-maze") {
        resetMaze();
        render();
      }
      if (action === "start-maintain") startMaintain();
      if (action === "maintain-action") handleMaintainAction(target.dataset.maintainAction);
      if (action === "play-again") playAgain();
    });

    document.addEventListener("change", (event) => {
      const target = event.target.closest("[data-action]");
      if (!target) return;
      const action = target.dataset.action;
      if (action === "set-dev-size") {
        appState.develop.size = Number(target.value);
      }
      if (action === "set-dev-difficulty") {
        appState.develop.difficulty = target.value;
      }
      if (action === "set-maintain-target") {
        appState.maintain.target = Number(target.value);
      }
      if (action === "set-maintain-speed") {
        appState.maintain.speed = target.value;
      }
    });

    document.addEventListener("change", (event) => {
      const target = event.target;
      if (!target.matches("[data-custom-color]")) return;
      appState.design.colors[appState.design.selectedPart] = target.value;
      render();
    });

    resetMaze();
    render();
  </script>
</body>
</html>
